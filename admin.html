<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>لوحة تحكم الدعوة</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: #fffdfb;
        font-family: Tajawal, Arial, sans-serif;
        color: #4a4a4a;
        padding: 30px 16px 60px;
    }
    .wrap { max-width: 920px; margin: 0 auto; }
    h1 {
        text-align: center;
        color: #73272d;
        font-size: 28px;
        margin-bottom: 30px;
    }
    .login-box {
        max-width: 380px;
        margin: 80px auto;
        background: #fff;
        border: 1px solid #ecdedb;
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 14px 34px rgba(60,20,25,0.10);
        text-align: center;
    }
    .login-box input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d8c3c3;
        border-radius: 10px;
        font-size: 15px;
        margin: 14px 0;
        text-align: center;
    }
    .login-box button, .refresh-btn {
        background: #8b3242;
        color: #fff;
        border: none;
        border-radius: 20px;
        padding: 12px 24px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
    }
    .login-box button:hover, .refresh-btn:hover { background: #73272d; }
    .login-error { color: #a02b2b; font-size: 13px; margin-top: 6px; display: none; }
    .stats-row {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 30px;
    }
    .stat-card {
        background: #fff;
        border: 1px solid #ecdedb;
        border-radius: 16px;
        padding: 20px 26px;
        text-align: center;
        min-width: 140px;
        box-shadow: 0 8px 20px rgba(60,20,25,0.06);
    }
    .stat-num { font-size: 32px; font-weight: 700; color: #8b3242; }
    .stat-label { font-size: 13px; color: #8a7576; margin-top: 6px; }
    .top-bar { display: flex; justify-content: center; margin-bottom: 20px; }
    table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(60,20,25,0.06);
    }
    th, td {
        padding: 12px 14px;
        text-align: right;
        font-size: 14px;
        border-bottom: 1px solid #f1e6e6;
    }
    th { background: #fdf4f4; color: #73272d; }
    tr:last-child td { border-bottom: none; }
    .tag {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 700;
    }
    .tag-yes { background: #e6f5ea; color: #2f6d3f; }
    .tag-no { background: #fbe9e9; color: #a02b2b; }
    .tag-maybe { background: #fff6e0; color: #9a7a1f; }
    .empty-note, .loading-note {
        text-align: center;
        color: #8a7576;
        padding: 30px 0;
    }
    .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">
    <h1>لوحة تحكم الدعوة</h1>

    <div class="login-box" id="loginBox">
        <div style="margin-bottom:6px;font-weight:700;color:#73272d;">دخول اللوحة</div>
        <input type="password" id="keyInput" placeholder="مفتاح الدخول (ADMIN_KEY)">
        <div><button id="loginBtn">دخول</button></div>
        <div class="login-error" id="loginError">المفتاح غير صحيح، حاول تاني.</div>
    </div>

    <div id="dashboard" style="display:none;">
        <div class="top-bar"><button class="refresh-btn" id="refreshBtn">تحديث البيانات</button></div>
        <div class="stats-row">
            <div class="stat-card"><div class="stat-num" id="statViews">-</div><div class="stat-label">عدد مرات فتح الدعوة</div></div>
            <div class="stat-card"><div class="stat-num" id="statTotal">-</div><div class="stat-label">إجمالي الردود</div></div>
            <div class="stat-card"><div class="stat-num" id="statYes">-</div><div class="stat-label">هيحضروا</div></div>
            <div class="stat-card"><div class="stat-num" id="statNo">-</div><div class="stat-label">اعتذروا</div></div>
            <div class="stat-card"><div class="stat-num" id="statMaybe">-</div><div class="stat-label">لسه مش متأكدين</div></div>
            <div class="stat-card"><div class="stat-num" id="statGuests">-</div><div class="stat-label">إجمالي المرافقين</div></div>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>الحضور</th>
                        <th>المرافقين</th>
                        <th>الرسالة</th>
                        <th>التاريخ</th>
                    </tr>
                </thead>
                <tbody id="rsvpBody"></tbody>
            </table>
            <div class="empty-note" id="emptyNote" style="display:none;">لسه محدش رد على الدعوة</div>
            <div class="loading-note" id="loadingNote">جاري التحميل...</div>
        </div>
    </div>
</div>

<script>
(function () {
    var loginBox = document.getElementById('loginBox');
    var dashboard = document.getElementById('dashboard');
    var keyInput = document.getElementById('keyInput');
    var loginBtn = document.getElementById('loginBtn');
    var loginError = document.getElementById('loginError');
    var refreshBtn = document.getElementById('refreshBtn');
    var adminKey = '';

    var params = new URLSearchParams(window.location.search);
    if (params.get('key')) {
        adminKey = params.get('key');
        tryLoad();
    }

    loginBtn.addEventListener('click', function () {
        adminKey = keyInput.value.trim();
        tryLoad();
    });
    keyInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') loginBtn.click();
    });
    refreshBtn.addEventListener('click', loadData);

    function tryLoad() {
        if (!adminKey) return;
        loadData(function (ok) {
            if (ok) {
                loginBox.style.display = 'none';
                dashboard.style.display = 'block';
                try { sessionStorage.setItem('wgr_admin_key', adminKey); } catch (e) {}
            }
        });
    }

    try {
        var savedKey = sessionStorage.getItem('wgr_admin_key');
        if (savedKey && !adminKey) {
            adminKey = savedKey;
            tryLoad();
        }
    } catch (e) {}

    function attendingTag(status) {
        if (status === 'yes') return '<span class="tag tag-yes">هيحضروا</span>';
        if (status === 'no') return '<span class="tag tag-no">اعتذروا</span>';
        return '<span class="tag tag-maybe">مش متأكدين</span>';
    }

    function formatDate(iso) {
        try {
            var d = new Date(iso);
            return d.toLocaleString('ar-EG', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        } catch (e) { return iso || ''; }
    }

    function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    function loadData(cb) {
        var loadingNote = document.getElementById('loadingNote');
        var emptyNote = document.getElementById('emptyNote');
        loadingNote.style.display = 'block';
        emptyNote.style.display = 'none';

        Promise.all([
            fetch('/api/view?key=' + encodeURIComponent(adminKey)).then(function (r) { return r.ok ? r.json() : Promise.reject({ status: r.status }); }),
            fetch('/api/rsvp?key=' + encodeURIComponent(adminKey)).then(function (r) { return r.ok ? r.json() : Promise.reject({ status: r.status }); })
        ]).then(function (results) {
            var viewData = results[0];
            var rsvpData = results[1];

            document.getElementById('statViews').textContent = viewData.count || 0;

            var rsvps = rsvpData.rsvps || [];
            var yes = 0, no = 0, maybe = 0, guests = 0;
            rsvps.forEach(function (r) {
                if (r.attending === 'yes') { yes++; guests += (r.guests || 0); }
                else if (r.attending === 'no') no++;
                else maybe++;
            });

            document.getElementById('statTotal').textContent = rsvps.length;
            document.getElementById('statYes').textContent = yes;
            document.getElementById('statNo').textContent = no;
            document.getElementById('statMaybe').textContent = maybe;
            document.getElementById('statGuests').textContent = guests;

            var body = document.getElementById('rsvpBody');
            body.innerHTML = '';
            if (!rsvps.length) {
                emptyNote.style.display = 'block';
            } else {
                rsvps.forEach(function (r) {
                    var tr = document.createElement('tr');
                    tr.innerHTML =
                        '<td>' + escapeHtml(r.name) + '</td>' +
                        '<td>' + attendingTag(r.attending) + '</td>' +
                        '<td>' + (r.guests || 0) + '</td>' +
                        '<td>' + escapeHtml(r.message) + '</td>' +
                        '<td>' + formatDate(r.createdAt) + '</td>';
                    body.appendChild(tr);
                });
            }

            loadingNote.style.display = 'none';
            if (cb) cb(true);
        }).catch(function (err) {
            loadingNote.style.display = 'none';
            var status = err && err.status;
            if (status === 401) {
                loginError.textContent = 'المفتاح غير صحيح، حاول تاني.';
            } else if (status) {
                loginError.textContent = 'في مشكلة في السيرفر أو قاعدة البيانات (خطأ ' + status + '). المفتاح ممكن يكون صح، بس السيرفر مش شغال. كلم اللي عامل الموقع.';
            } else {
                loginError.textContent = 'مقدرش أوصل للسيرفر خالص. تأكد إن الموقع متنشر (deployed) على Vercel وإن فيه اتصال إنترنت.';
            }
            loginError.style.display = 'block';
            if (cb) cb(false);
        });
    }
})();
</script>
</body>
</html>
